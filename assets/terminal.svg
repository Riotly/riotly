<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Terminal">
  <style>
    .mono { font: 14px Consolas, "Courier New", monospace; }
    .title { font: 700 11px Verdana, Geneva, sans-serif; fill: #2a1b45; letter-spacing: 1px; }
    @keyframes blink { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { fill: #7dffb3; animation: blink 1.15s steps(1, end) infinite; }
  </style>
  <rect width="1200" height="360" rx="10" fill="#1a1028"/>
  <rect x="0" y="0" width="1200" height="32" fill="#cbb8e4"/>
  <circle cx="22" cy="16" r="6" fill="#ff6b8a"/>
  <circle cx="42" cy="16" r="6" fill="#ffd36b"/>
  <circle cx="62" cy="16" r="6" fill="#7dffb3"/>
  <text x="90" y="20" class="title">riotly@night  ~  zsh</text>
  <text x="36" y="58" fill="#7dffb3" class="mono" opacity="0">$ whoami<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.15s" fill="freeze"/></text>
<text x="36" y="76" fill="#f6eefe" class="mono" opacity="0">harsh kohli<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.31s" fill="freeze"/></text>
<text x="36" y="94" fill="#cbb8e4" class="mono" opacity="0">gamer. developer. still at the bench.<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.47s" fill="freeze"/></text>
<text x="36" y="112" fill="#cbb8e4" class="mono" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.63s" fill="freeze"/></text>
<text x="36" y="130" fill="#7dffb3" class="mono" opacity="0">$ cat about.txt<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.79s" fill="freeze"/></text>
<text x="36" y="148" fill="#e4d7f5" class="mono" opacity="0">I write software, I test it like it matters,<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.95s" fill="freeze"/></text>
<text x="36" y="166" fill="#e4d7f5" class="mono" opacity="0">and I keep learning the systems underneath,<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.11s" fill="freeze"/></text>
<text x="36" y="184" fill="#e4d7f5" class="mono" opacity="0">including the ones that move money.<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.27s" fill="freeze"/></text>
<text x="36" y="202" fill="#e4d7f5" class="mono" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.43s" fill="freeze"/></text>
<text x="36" y="220" fill="#cbb8e4" class="mono" opacity="0">First computer in 2015. Shipping for real in 2022.<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.59s" fill="freeze"/></text>
<text x="36" y="238" fill="#cbb8e4" class="mono" opacity="0">Senior QA in 2024. Still asking what happens<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.75s" fill="freeze"/></text>
<text x="36" y="256" fill="#cbb8e4" class="mono" opacity="0">if you press it twice.<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.91s" fill="freeze"/></text>
<text x="36" y="274" fill="#cbb8e4" class="mono" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.07s" fill="freeze"/></text>
<text x="36" y="292" fill="#7dffb3" class="mono" opacity="0">$ echo site<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.23s" fill="freeze"/></text>
<text x="36" y="310" fill="#9ae0ff" class="mono" opacity="0">https://harshkohli.com<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.39s" fill="freeze"/></text>
  <rect class="cursor" x="36" y="332" width="8" height="14"/>
</svg>